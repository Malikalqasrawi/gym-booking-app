name: gym_booking
description: "Gym session booking app (Flutter frontend for the Java backend)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2              # calling the Java REST API
  provider: ^6.1.2          # sharing SessionController / ThemeController with all screens
  shared_preferences: ^2.3.2   # saving the theme choice on the phone
  flutter_secure_storage: ^11.2.0   # login token, encrypted (Android Keystore / iPhone Keychain)
  flutter_map: ^8.3.2       # OpenStreetMap map widget (branch pins)
  latlong2: ^0.10.1         # LatLng type used by flutter_map
  flutter_stripe: ^14.1.0   # Stripe's payment screen (the card goes straight to Stripe, never to our server)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
