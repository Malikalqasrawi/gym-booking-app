name: gym_booking
description: "Mobile client for the Gym Booking API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_stripe: ^14.1.0
  qr_flutter: ^4.1.0
  google_sign_in: ^7.2.0
  # Phone field with a country picker. 11.x moved to the new material_ui package, which this app
  # doesn't use yet, so stay on 10.x.
  phone_form_field: ^10.0.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
