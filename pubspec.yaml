publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_stripe: ^14.1.0
